{% extends "app/base.html" %}

{% block title %}Edit {{ lot.lot_number }}{% endblock %}
{% block page_heading %}Edit {{ lot.lot_number }}{% endblock %}

{% block content %}
<div class="card agri-card">
    <div class="card-body p-4">
        <p class="text-muted">Only REGISTERED lots can be edited.</p>
        <form method="post" novalidate>
            {% include "lots/_form.html" %}
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-agri" type="submit">Save changes</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('lots.view', lot_id=lot.lot_id) }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
