{% extends "app/base.html" %}

{% block title %}Register lot{% endblock %}
{% block page_heading %}Register produce lot{% endblock %}

{% block content %}
<div class="card agri-card">
    <div class="card-body p-4">
        <p class="text-muted">New lots start as REGISTERED. Open the auction when bidding should begin.</p>
        <form method="post" novalidate>
            {% include "lots/_form.html" %}
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-agri" type="submit">Save lot</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('lots.index') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
