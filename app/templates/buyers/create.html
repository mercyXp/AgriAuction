{% extends "app/base.html" %}

{% block title %}Register buyer{% endblock %}
{% block page_heading %}Register buyer{% endblock %}

{% block content %}
<div class="card agri-card">
    <div class="card-body p-4">
        <form method="post" novalidate>
            {% include "buyers/_form.html" %}
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-agri" type="submit">Save buyer</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('buyers.index') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
