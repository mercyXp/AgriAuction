{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card agri-card">
                <div class="card-body p-4">
                    <h1 class="h3">404 — Page not found</h1>
                    <p>The page you requested does not exist. It may have been moved, or the address may be incorrect.</p>
                    <a class="btn btn-agri" href="{{ url_for('main.home') }}">Return home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
