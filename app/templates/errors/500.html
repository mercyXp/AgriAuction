{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card agri-card">
                <div class="card-body p-4">
                    <h1 class="h3">500 — Something went wrong</h1>
                    <p>The application could not complete this request. Please try again. If the problem continues, contact the system administrator.</p>
                    <a class="btn btn-agri" href="{{ url_for('main.home') }}">Return home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
