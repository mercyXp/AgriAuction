{% extends "app/base.html" %}

{% block title %}Edit {{ farmer.farmer_code }}{% endblock %}
{% block page_heading %}Edit {{ farmer.farmer_code }}{% endblock %}

{% block content %}
<div class="card agri-card">
    <div class="card-body p-4">
        <p class="text-muted">Farmer code cannot be changed.</p>
        <form method="post" novalidate>
            {% include "farmers/_form.html" %}
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-agri" type="submit">Save changes</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('farmers.view', farmer_id=farmer.farmer_id) }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
