{% extends "app/base.html" %}

{% block title %}Register farmer{% endblock %}
{% block page_heading %}Register farmer{% endblock %}

{% block content %}
<div class="card agri-card">
    <div class="card-body p-4">
        {% if errors.get('farmer_code') %}
        <div class="alert alert-danger">{{ errors.farmer_code }}</div>
        {% endif %}
        <form method="post" novalidate>
            {% include "farmers/_form.html" %}
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-agri" type="submit">Save farmer</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('farmers.index') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
